
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmácia - Medicamentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Sistema de Farmácia</h1>
        <p>Cadastro e consulta de medicamentos</p>

        <h2>Cadastrar medicamento</h2>

        <form id="formMedicamento">
            <label for="nome">Nome do medicamento</label>
            <input type="text" id="nome" required>

            <label for="fabricante">Fabricante</label>
            <input type="text" id="fabricante" required>

            <label for="preco">Preço</label>
            <input type="number" id="preco" min="0" step="0.01" required>

            <label for="estoque">Quantidade em estoque</label>
            <input type="number" id="estoque" min="0" step="1" required>

            <button type="submit">Cadastrar</button>
        </form>

        <p id="mensagem"></p>

        <h2>Medicamentos cadastrados</h2>

        <div id="listaMedicamentos">
            Carregando medicamentos...
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
